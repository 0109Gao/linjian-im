server:
  port: 8083

spring:
  application:
    name: linjian-im
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/im?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${IM_DB_USER:im}
    password: ${IM_DB_PASSWORD:im123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      database: 2
      timeout: 2000ms
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input

im:
  jwt:
    # 故意不给可用的默认值：为空时 JwtProperties 会让应用拒绝启动。
    # 本地启动前必须设置环境变量 IM_JWT_SECRET，见 本地运行说明.md。
    secret: ${IM_JWT_SECRET:}
    expire-hours: 24
  snowflake:
    worker-id: ${IM_WORKER_ID:1}

logging:
  level:
    root: info
    com.linjian.im: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
