# ============================================================
# 集成测试专用配置
#
# 三个隔离点都需要，缺一个就会污染别的数据：
#   1. 数据库指向 im_test，而不是演示用的 im——测试要 TRUNCATE、要断言「未读数为 0」
#      这种绝对值，混在演示库上一个断言都写不干净
#   2. Redis 指向 db15，而不是生产配置的 db2——否则测试会把 im:seq: 计数推到别的值
#   3. 每次启动执行一遍 schema.sql，保证测试库结构与生产库来自同一份 DDL
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/im_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${IM_DB_USER:im}
    password: ${IM_DB_PASSWORD:im123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      database: 15
      timeout: 2000ms
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

im:
  jwt:
    # 测试专用密钥。长度与格式都满足 JwtProperties 的校验，且不命中占位符黑名单；
    # 它不可能被误用到生产，因为生产环境不加载 test profile。
    secret: test-only-im-jwt-secret-for-integration-0123456789abcdefghijk
    expire-hours: 24
  snowflake:
    worker-id: 1

logging:
  level:
    root: warn
    com.linjian.im: info
