# ============================================================
# 林间即时通讯系统 · 本地开发编排
# 只用两个中间件；应用本身在本地以 mvn spring-boot:run 启动，便于改代码即时生效。
# 端口刻意与秒杀系统错开：3307 / 6380（秒杀用 3306 / 6379，且未映射到宿主）。
# ============================================================

name: linjian-im

services:
  mysql:
    image: mysql:8.4
    container_name: im-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456789"
      MYSQL_DATABASE: im
      MYSQL_USER: im
      MYSQL_PASSWORD: im123456
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max-connections=200
    ports:
      - "3307:3306"
    volumes:
      - im-mysql-data:/var/lib/mysql
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../sql/seed-dev.sql:/docker-entrypoint-initdb.d/02-seed-dev.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456789"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: im-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6380:6379"
    volumes:
      - im-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  im-mysql-data:
    name: im-mysql-data
  im-redis-data:
    name: im-redis-data
